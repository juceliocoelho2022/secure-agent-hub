spring:
  application:
    name: secure-agent-hub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/secure_agent_hub}
    username: ${DB_USER:secureagent}
    password: ${DB_PASSWORD:secureagent}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: ${KAFKA_GROUP_ID:secure-agent-hub}
      auto-offset-reset: earliest
      enable-auto-commit: false
  ai:
    model:
      chat: ${SPRING_AI_CHAT_MODEL:none}
      embedding: ${SPRING_AI_EMBEDDING_MODEL:none}
      image: ${SPRING_AI_IMAGE_MODEL:none}
      moderation: ${SPRING_AI_MODERATION_MODEL:none}
      audio:
        speech: ${SPRING_AI_AUDIO_SPEECH_MODEL:none}
        transcription: ${SPRING_AI_AUDIO_TRANSCRIPTION_MODEL:none}
    chat:
      client:
        tool-calling:
          enabled: false
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-5-mini}
          temperature: ${OPENAI_CHAT_TEMPERATURE:0.2}

server:
  port: ${PORT:8080}

app:
  agent:
    planner: ${AGENT_PLANNER:rules}
  bootstrap:
    dev-users: ${BOOTSTRAP_DEV_USERS:true}
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-secure-agent-hub-dev-secret-32bytes-minimum}
      access-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-ttl: ${JWT_REFRESH_TTL:7d}
  events:
    topic: ${AGENT_EVENTS_TOPIC:secure-agent.events}
    dlt-topic: ${AGENT_EVENTS_DLT_TOPIC:secure-agent.events.DLT}
    outbox-poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:1000}
    failure-injection-event-type: ${AGENT_EVENTS_FAILURE_INJECTION_TYPE:agent.test.failure}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
