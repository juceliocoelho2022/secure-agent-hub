services:
  postgres:
    image: postgres:17-alpine
    container_name: secure-agent-postgres
    environment:
      POSTGRES_DB: secure_agent_hub
      POSTGRES_USER: secureagent
      POSTGRES_PASSWORD: secureagent
    ports:
      - "5432:5432"
    volumes:
      - secure_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureagent -d secure_agent_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  secure_agent_pgdata:
